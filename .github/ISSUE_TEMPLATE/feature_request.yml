name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to be able to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why? What are you trying to achieve?
  - type: markdown
    attributes:
      value: |
        Keep in mind that the light strips accept only about **3 updates per second**, so features that stream fast frames are limited. Ideas that use the strip's own effects are the easiest to do well.
